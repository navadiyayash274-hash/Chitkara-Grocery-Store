<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Information - Chitkara Grocery Store</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; outline:none; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0b1a0d 0%, #0d1f3c 35%, #1a0b2e 70%, #0b1a0d 100%);
            background-size: 400% 400%;
            animation: bgAnim 12s ease infinite;
            display: block;
            padding: 40px 20px;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
        }

        @keyframes bgAnim {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body::before {
            content: '';
            position: fixed; top:0; left:0; width:100%; height:100%;
            background-image:
                linear-gradient(rgba(78,176,96,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(78,176,96,0.04) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none; z-index:0;
            animation: gridScroll 20s linear infinite;
        }

        @keyframes gridScroll {
            from { transform: translateY(0); }
            to   { transform: translateY(50px); }
        }

        body::after {
            content: '';
            position: fixed;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(142,68,173,0.15) 0%, transparent 70%);
            top: -150px; right: -150px;
            border-radius: 50%;
            pointer-events: none; z-index: 0;
            animation: orbFloat 8s ease-in-out infinite alternate;
        }

        @keyframes orbFloat {
            from { transform: scale(1); }
            to   { transform: scale(1.3) translate(-20px, 20px); }
        }

        /* ===== CARD ===== */
        .info-card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(78,176,96,0.25);
            border-radius: 28px;
            padding: 40px 35px;
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.7s ease both;
        }

        @keyframes fadeInUp {
            from { opacity:0; transform:translateY(35px); }
            to   { opacity:1; transform:translateY(0); }
        }

        /* Header */
        .card-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .card-header .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: #e0e0e0;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .card-header .logo span { color: #4eb060; }

        .card-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, #4eb060, #a5d6a7, #ffffff, #a5d6a7, #4eb060);
            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textShine 4s linear infinite;
            margin-bottom: 6px;
        }

        @keyframes textShine {
            0%   { background-position: 0%; }
            100% { background-position: 300%; }
        }

        .card-header p { color: #9ca3af; font-size: 0.82rem; }

        /* Progress bar */
        .progress-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0;
            margin-bottom: 28px;
        }

        .prog-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .prog-circle {
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem; font-weight: 700;
        }

        .prog-circle.done { background: #4eb060; color: #fff; }
        .prog-circle.active {
            background: linear-gradient(135deg, #4eb060, #2e7d32);
            color: #fff;
            box-shadow: 0 0 15px rgba(78,176,96,0.5);
            animation: pulseProg 1.5s ease-in-out infinite;
        }
        .prog-circle.pending { background: rgba(255,255,255,0.1); color: #9ca3af; }

        @keyframes pulseProg {
            0%,100% { box-shadow: 0 0 10px rgba(78,176,96,0.4); }
            50%      { box-shadow: 0 0 25px rgba(78,176,96,0.8); }
        }

        .prog-label { font-size: 0.65rem; color: #9ca3af; }
        .prog-label.active-lbl { color: #4eb060; font-weight: 600; }

        .prog-line {
            width: 50px; height: 2px;
            background: rgba(78,176,96,0.2);
            margin-bottom: 16px;
        }

        .prog-line.done-line { background: #4eb060; }

        /* Form rows */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            color: #81c784;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(78,176,96,0.25) !important;
            border-radius: 12px;
            color: #e0e0e0;
            font-size: 0.88rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }

        .form-input::placeholder { color: rgba(255,255,255,0.25); }

        .form-input:focus {
            border-color: rgba(78,176,96,0.7) !important;
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 15px rgba(78,176,96,0.15);
            transform: translateY(-2px);
        }

        select.form-input option { background: #1a1a2e; color: #e0e0e0; }

        /* Avatar section */
        .avatar-section {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(78,176,96,0.2);
            border-radius: 16px;
            padding: 16px;
        }

        .avatar-circle {
            width: 60px; height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4eb060, #2e7d32);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 6px 20px rgba(78,176,96,0.4);
            flex-shrink: 0;
        }

        .avatar-info h4 { color: #e0e0e0; font-size: 0.9rem; font-weight: 700; }
        .avatar-info p  { color: #81c784; font-size: 0.78rem; }

        /* Submit button */
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(120deg, #4eb060, #2e7d32);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(78,176,96,0.4);
            font-family: 'Poppins', sans-serif;
            letter-spacing: 1px;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }

        .submit-btn::after {
            content: '';
            position: absolute; top:0; left:-100%;
            width:60%; height:100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s ease;
        }

        .submit-btn:hover::after { left: 150%; }
        .submit-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 35px rgba(78,176,96,0.6); }

        .skip-btn {
            width: 100%;
            padding: 11px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15) !important;
            border-radius: 14px;
            color: #9ca3af;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            margin-top: 8px;
            transition: all 0.3s ease;
        }

        .skip-btn:hover { color: #e0e0e0; background: rgba(255,255,255,0.1); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 7px; }
        ::-webkit-scrollbar-track { background: #0b1a0d; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(#4eb060, #7b2fbe); border-radius: 10px; }

        @media(max-width:480px) {
            .form-row { grid-template-columns: 1fr; }
            .info-card { padding: 30px 20px; }
        }
    </style>
<script src="Auth JS.js"></script>
</head>
<body>

    <div class="info-card">

        <!-- Header -->
        <div class="card-header">
            <div class="logo"><span>C</span>GS</div>
            <h2>Personal Information</h2>
            <p>Tell us about yourself to personalise your experience</p>
        </div>

        <!-- Progress -->
        <div class="progress-bar">
            <div class="prog-step">
                <div class="prog-circle done">✓</div>
                <span class="prog-label">Login</span>
            </div>
            <div class="prog-line done-line"></div>
            <div class="prog-step">
                <div class="prog-circle active">2</div>
                <span class="prog-label active-lbl">Profile</span>
            </div>
            <div class="prog-line"></div>
            <div class="prog-step">
                <div class="prog-circle pending">3</div>
                <span class="prog-label">Home</span>
            </div>
        </div>

        <!-- Avatar -->
        <div class="avatar-section">
            <div class="avatar-circle" id="avatarEmoji">👤</div>
            <div class="avatar-info">
                <h4 id="avatar-name">Welcome!</h4>
                <p id="avatar-contact">Complete your profile below</p>
            </div>
        </div>

        <!-- Form -->
        <form onsubmit="saveInfo(event)">

            <div class="form-row">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" class="form-input" id="first-name" placeholder="Yash" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" class="form-input" id="last-name" placeholder="Navadiya" required>
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" class="form-input" id="info-email" placeholder="yourname@email.com">
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" class="form-input" id="info-phone" placeholder="10-digit mobile number" maxlength="10">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" class="form-input" id="info-dob">
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select class="form-input" id="info-gender">
                        <option value="" disabled selected>Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Full Address</label>
                <input type="text" class="form-input" id="info-address" placeholder="House No, Street, Area">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>City</label>
                    <input type="text" class="form-input" id="info-city" placeholder="Surat">
                </div>
                <div class="form-group">
                    <label>Pincode</label>
                    <input type="text" class="form-input" id="info-pincode" placeholder="395001" maxlength="6">
                </div>
            </div>

            <button type="submit" class="submit-btn">🚀 Save & Continue to Home</button>
            <button type="button" class="skip-btn" onclick="skipInfo()">Skip for now →</button>

        </form>

    </div>

    <script>
        function splitName(name) {
            const parts = (name || '').trim().split(/\s+/).filter(Boolean);
            if (parts.length >= 2) return [parts[0], parts.slice(1).join(' ')];
            return [parts[0] || '', ''];
        }

        function isSuratDelivery(city, address, pincode) {
            const text = `${city || ''} ${address || ''} ${pincode || ''}`.toLowerCase();
            return /surat/.test(text) || /^39\d{5}$/.test(String(pincode || '').trim());
        }

        document.addEventListener('DOMContentLoaded', function() {
            const name = localStorage.getItem('cgs_user_name') || '';
            const contact = localStorage.getItem('cgs_user_contact') || '';
            const saved = JSON.parse(localStorage.getItem('cgs_profile') || '{}');
            const [savedFirstName, savedLastName] = splitName(saved.fullName || name || '');

            document.getElementById('avatarEmoji').textContent = saved.gender === 'Male' ? '👨' : saved.gender === 'Female' ? '👩' : '👤';
            document.getElementById('avatar-name').textContent = saved.fullName || name || 'Welcome!';
            document.getElementById('avatar-contact').textContent = saved.email || saved.phone || contact || 'Complete your profile below';

            document.getElementById('first-name').value = saved.firstName || savedFirstName || '';
            document.getElementById('last-name').value = saved.lastName || savedLastName || '';
            document.getElementById('info-email').value = saved.email || (contact.includes('@') ? contact : '');
            document.getElementById('info-phone').value = saved.phone || (contact.length === 10 ? contact : '');
            document.getElementById('info-dob').value = saved.dob || '';
            document.getElementById('info-gender').value = saved.gender || '';
            document.getElementById('info-address').value = saved.address || '';
            document.getElementById('info-city').value = saved.city || '';
            document.getElementById('info-pincode').value = saved.pincode || '';

            document.getElementById('info-gender').addEventListener('change', function() {
                const emojiMap = { Male: '👨', Female: '👩', Other: '🧑' };
                document.getElementById('avatarEmoji').textContent = emojiMap[this.value] || '👤';
            });

            document.getElementById('first-name').addEventListener('input', updateAvatar);
            document.getElementById('last-name').addEventListener('input', updateAvatar);
        });

        function updateAvatar() {
            const fn = document.getElementById('first-name').value.trim();
            const ln = document.getElementById('last-name').value.trim();
            const full = [fn, ln].filter(Boolean).join(' ');
            document.getElementById('avatar-name').textContent = full || 'Your Name';
        }

        function validateSuratDelivery(info) {
            const city = (info.city || '').trim();
            const address = (info.address || '').trim();
            const pincode = (info.pincode || '').trim();

            if (!isSuratDelivery(city, address, pincode)) {
                alert('Chitkara Grocery Store delivers groceries only in Surat city. We do not deliver outside Surat.');
                return false;
            }

            return true;
        }

        function saveInfo(e) {
            e.preventDefault();

            const info = {
                firstName: document.getElementById('first-name').value.trim(),
                lastName: document.getElementById('last-name').value.trim(),
                email: document.getElementById('info-email').value.trim(),
                phone: document.getElementById('info-phone').value.trim(),
                dob: document.getElementById('info-dob').value,
                gender: document.getElementById('info-gender').value,
                address: document.getElementById('info-address').value.trim(),
                city: document.getElementById('info-city').value.trim(),
                pincode: document.getElementById('info-pincode').value.trim()
            };
            info.fullName = [info.firstName, info.lastName].filter(Boolean).join(' ');

            if (!info.fullName) {
                alert('Please enter your first name and last name.');
                return;
            }

            if (!validateSuratDelivery(info)) {
                return;
            }

            localStorage.setItem('cgs_profile', JSON.stringify(info));
            localStorage.setItem('cgs_user_name', info.fullName);
            localStorage.setItem('cgs_profile_done', 'true');

            if (info.email) localStorage.setItem('cgs_email', info.email);
            if (info.phone) localStorage.setItem('cgs_phone', info.phone);
            if (info.address) localStorage.setItem('cgs_address', info.address);
            if (info.city) localStorage.setItem('cgs_city', info.city);
            if (info.pincode) localStorage.setItem('cgs_pincode', info.pincode);
            if (info.dob) localStorage.setItem('cgs_dob', info.dob);

            fetch('http://localhost:5000/api/users/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: info.fullName,
                    email: info.email || localStorage.getItem('cgs_user_contact'),
                    phone: info.phone || localStorage.getItem('cgs_user_contact'),
                    contact: localStorage.getItem('cgs_user_contact') || '',
                    gender: info.gender,
                    dob: info.dob,
                    address: info.address,
                    city: info.city,
                    pincode: info.pincode,
                    password: 'otp_verified'
                })
            }).then(r => r.json()).catch(() => {});

            window.location.href = 'Home Page HTML.html';
        }

        function skipInfo() {
            localStorage.setItem('cgs_profile_done', 'true');
            window.location.href = 'Home Page HTML.html';
        }
    </script>

</body>
</html>
