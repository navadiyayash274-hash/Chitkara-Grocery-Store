<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Chitkara Grocery Store</title>
    <script src="Auth JS.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }

        body {
            min-height:100vh;
            background:linear-gradient(135deg,#0b1a0d 0%,#0d1f3c 35%,#1a0b2e 70%,#0b1a0d 100%);
            background-size:400% 400%;
            animation:bgAnim 12s ease infinite;
            padding:0 0 60px 0;
            position:relative; overflow-x:hidden;
        }
        @keyframes bgAnim{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

        body::before{
            content:'';position:fixed;top:0;left:0;width:100%;height:100%;
            background-image:linear-gradient(rgba(78,176,96,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(78,176,96,0.04) 1px,transparent 1px);
            background-size:50px 50px;pointer-events:none;z-index:0;
            animation:gridScroll 20s linear infinite;
        }
        @keyframes gridScroll{from{transform:translateY(0)}to{transform:translateY(50px)}}

        body::after{
            content:'';position:fixed;width:500px;height:500px;
            background:radial-gradient(circle,rgba(142,68,173,0.15) 0%,transparent 70%);
            top:-150px;right:-150px;border-radius:50%;pointer-events:none;z-index:0;
            animation:orbFloat 8s ease-in-out infinite alternate;
        }
        @keyframes orbFloat{from{transform:scale(1)}to{transform:scale(1.3) translate(-20px,20px)}}

        /* NAV */
        .top-nav{
            display:flex;justify-content:space-between;align-items:center;
            padding:18px 40px;
            background:rgba(255,255,255,0.06);
            backdrop-filter:blur(20px);
            border-bottom:1px solid rgba(78,176,96,0.2);
            position:sticky;top:0;z-index:100;
        }
        .top-nav .logo{font-size:1.4rem;font-weight:900;color:#e0e0e0;text-decoration:none;letter-spacing:1px;}
        .top-nav .logo span{color:#4eb060;}
        .top-nav a.back-btn{
            padding:10px 22px;background:linear-gradient(135deg,#4eb060,#2e7d32);
            color:#fff;text-decoration:none;border-radius:30px;font-size:0.85rem;font-weight:600;
            transition:all 0.3s ease;box-shadow:0 4px 15px rgba(78,176,96,0.3);
        }
        .top-nav a.back-btn:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(78,176,96,0.5);}

        /* PAGE HEADER */
        .page-header{
            text-align:center;padding:40px 20px 20px;
            position:relative;z-index:1;
            animation:fadeDown 0.7s ease both;
        }
        @keyframes fadeDown{from{opacity:0;transform:translateY(-25px)}to{opacity:1;transform:translateY(0)}}
        .page-header h1{
            font-size:2.2rem;font-weight:900;
            background:linear-gradient(90deg,#4eb060,#a5d6a7,#fff,#a5d6a7,#4eb060);
            background-size:300%;
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
            animation:textShine 4s linear infinite;letter-spacing:3px;
        }
        @keyframes textShine{0%{background-position:0%}100%{background-position:300%}}
        .page-header p{color:#9ca3af;font-size:0.9rem;margin-top:8px;}

        /* STATS ROW */
        .stats-row{
            display:flex;gap:16px;max-width:900px;margin:0 auto 30px auto;
            padding:0 20px;position:relative;z-index:1;flex-wrap:wrap;
        }
        .stat-card{
            flex:1;min-width:140px;
            background:rgba(255,255,255,0.06);
            backdrop-filter:blur(15px);
            border:1px solid rgba(78,176,96,0.2);
            border-radius:18px;padding:20px;text-align:center;
            transition:all 0.3s ease;animation:fadeInUp 0.6s ease both;
        }
        .stat-card:hover{transform:translateY(-5px);border-color:rgba(78,176,96,0.5);box-shadow:0 12px 30px rgba(78,176,96,0.15);}
        .stat-card .num{
            font-size:1.8rem;font-weight:900;
            background:linear-gradient(90deg,#4eb060,#a5d6a7);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
        }
        .stat-card .lbl{color:#9ca3af;font-size:0.78rem;margin-top:4px;}

        /* ORDERS LIST */
        .orders-container{max-width:900px;margin:0 auto;padding:0 20px;position:relative;z-index:1;}

        @keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

        /* EMPTY STATE */
        .empty-state{
            text-align:center;padding:80px 20px;
            background:rgba(255,255,255,0.04);border:1px solid rgba(78,176,96,0.15);
            border-radius:24px;
        }
        .empty-state .icon{font-size:5rem;margin-bottom:15px;animation:bounce 3s ease-in-out infinite;}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
        .empty-state h3{color:#e0e0e0;font-size:1.4rem;font-weight:700;margin-bottom:8px;}
        .empty-state p{color:#9ca3af;font-size:0.9rem;margin-bottom:25px;}
        .empty-state a{
            padding:13px 35px;background:linear-gradient(120deg,#4eb060,#2e7d32);
            color:#fff;text-decoration:none;border-radius:30px;font-weight:700;font-size:0.9rem;
            box-shadow:0 8px 25px rgba(78,176,96,0.4);transition:all 0.3s ease;display:inline-block;
        }
        .empty-state a:hover{transform:translateY(-3px);box-shadow:0 12px 35px rgba(78,176,96,0.6);}

        /* ORDER CARD */
        .order-card{
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(15px);
            border:1px solid rgba(78,176,96,0.15);
            border-radius:20px;
            margin-bottom:18px;overflow:hidden;
            transition:all 0.35s ease;
            animation:fadeInUp 0.6s ease both;
        }
        .order-card:hover{border-color:rgba(78,176,96,0.4);box-shadow:0 15px 40px rgba(78,176,96,0.15);transform:translateY(-3px);}

        .order-header{
            display:flex;justify-content:space-between;align-items:center;
            padding:18px 24px;cursor:pointer;
            border-bottom:1px solid rgba(78,176,96,0.1);
        }
        .order-header:hover{background:rgba(78,176,96,0.05);}

        .order-id-block h4{color:#4eb060;font-size:0.9rem;font-weight:700;margin-bottom:3px;}
        .order-id-block p{color:#9ca3af;font-size:0.78rem;}

        .order-status{
            padding:5px 14px;border-radius:20px;font-size:0.75rem;font-weight:700;
            background:rgba(78,176,96,0.15);color:#4eb060;border:1px solid rgba(78,176,96,0.3);
        }
        .order-status.pending{background:rgba(253,204,13,0.15);color:#fdcc0d;border-color:rgba(253,204,13,0.3);}
        .order-status.cancelled{background:rgba(255,80,80,0.15);color:#ff6b6b;border-color:rgba(255,80,80,0.3);}

        .order-meta{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
        .order-meta .price{
            font-size:1.1rem;font-weight:800;
            background:linear-gradient(90deg,#4eb060,#a5d6a7);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
        }
        .order-chevron{color:#81c784;font-size:1rem;transition:transform 0.3s ease;}
        .order-chevron.open{transform:rotate(180deg);}

        .order-body{display:none;padding:18px 24px;}
        .order-body.open{display:block;}

        .order-items{margin-bottom:15px;}
        .order-item{
            display:flex;align-items:center;gap:14px;
            padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);
        }
        .order-item:last-child{border-bottom:none;}
        .order-item img{width:50px;height:50px;object-fit:contain;background:rgba(255,255,255,0.05);border-radius:10px;padding:5px;}
        .order-item-info h5{color:#e0e0e0;font-size:0.88rem;font-weight:600;}
        .order-item-info p{color:#9ca3af;font-size:0.78rem;}
        .order-item-price{margin-left:auto;color:#4eb060;font-weight:700;font-size:0.9rem;}

        .order-footer{
            display:grid;grid-template-columns:1fr 1fr 1fr;
            gap:12px;margin-top:12px;
            background:rgba(255,255,255,0.03);
            border-radius:12px;padding:14px;
        }
        .order-footer-item .lbl{color:#9ca3af;font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;}
        .order-footer-item .val{color:#e0e0e0;font-size:0.85rem;font-weight:600;}

        /* Action buttons */
        .order-action-btn {
            padding:9px 20px; border:none; border-radius:20px;
            font-size:0.82rem; font-weight:700; cursor:pointer;
            font-family:'Poppins',sans-serif; transition:all 0.3s ease;
        }
        .cancel-btn  { background:rgba(255,80,80,0.12); color:#ff6b6b; border:1px solid rgba(255,80,80,0.3); }
        .cancel-btn:hover  { background:rgba(255,80,80,0.25); transform:translateY(-2px); }
        .return-btn  { background:rgba(41,182,246,0.12); color:#29b6f6; border:1px solid rgba(41,182,246,0.3); }
        .return-btn:hover  { background:rgba(41,182,246,0.25); transform:translateY(-2px); }

        /* Scrollbar */
        ::-webkit-scrollbar{width:7px;}
        ::-webkit-scrollbar-track{background:#0b1a0d;}
        ::-webkit-scrollbar-thumb{background:linear-gradient(#4eb060,#7b2fbe);border-radius:10px;}

        @media(max-width:600px){
            .order-header{flex-direction:column;gap:10px;align-items:flex-start;}
            .order-footer{grid-template-columns:1fr 1fr;}
            .stats-row{flex-direction:column;}
        }
    </style>
</head>
<body>

    <!-- Nav -->
    <nav class="top-nav">
        <a href="Home Page HTML.html" class="logo"><span>C</span>GS</a>
        <span style="color:#4eb060;font-weight:700;">📦 My Orders</span>
        <a href="Home Page HTML.html" class="back-btn">🏠 Home</a>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <h1>📦 MY ORDERS</h1>
        <p>Track and manage all your orders from Chitkara Grocery Store</p>
    </div>

    <!-- Stats -->
    <div class="stats-row" id="stats-row">
        <div class="stat-card">
            <div class="num" id="stat-total">0</div>
            <div class="lbl">Total Orders</div>
        </div>
        <div class="stat-card">
            <div class="num" id="stat-amount">Rs.0</div>
            <div class="lbl">Total Spent</div>
        </div>
        <div class="stat-card">
            <div class="num" id="stat-items">0</div>
            <div class="lbl">Items Ordered</div>
        </div>
    </div>

    <!-- Orders -->
    <div class="orders-container" id="orders-container">
        <div class="empty-state">
            <div class="icon">📦</div>
            <h3>No Orders Yet</h3>
            <p>You haven't placed any orders yet.<br>Start shopping to see your orders here!</p>
            <a href="Home Page HTML.html">🛒 Start Shopping</a>
        </div>
    </div>

    <script src="My Orders JS.js"></script>

</body>
</html>
